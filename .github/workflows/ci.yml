name: Frontend CI/CD

on:
  pull_request:
  push:
    branches: [stage]
    paths-ignore:
      - "k8s/**"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4

  image:
    if: github.event_name == 'push'
    needs: [quality, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=stage
            type=raw,value=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-stage-manifest:
    if: github.event_name == 'push' && github.ref_name == 'stage'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
          fetch-depth: 0
      - name: Update immutable stage image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/stage/kustomization.yaml")
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.strip() == "- name: ghcr.io/ilhamzefer-sketch/turn-ui":
                  lines[index + 1] = f"    newTag: {os.environ['IMAGE_TAG']}"
                  break
          else:
              raise SystemExit("Frontend image entry was not found in kustomization.yaml")
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Commit deployment revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- k8s/stage/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(stage): deploy frontend ${{ github.sha }} [skip ci]"
          git push origin HEAD:stage
